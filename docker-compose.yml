services:
  card-hub:
    build: .
    image: allornothing/card-hub:latest
    container_name: card-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - SESSION_SECRET=change-this-to-a-random-string
